name: Update GitAll SVG
on:
  schedule:
  - cron: '37 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-svg:
    name: Update GitAll SVG
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Fetch and recolor GitAll SVG
      run: pipx run scripts/gitall.py

    - name: Commit changes
      run: |
        git add assets/gitall.svg

        if git diff --cached --quiet; then
          echo 'SVG has not changed'
          exit 0
        fi

        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m 'chore: update GitAll SVG'
        git push
